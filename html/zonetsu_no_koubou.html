    .tool-column {
      position: absolute;

    #toolbar {
      display: flex;

      display: block;
      cursor: grab;
    }

      top: 50%;
      left: 50%;

      width: 42vw;
      height: 42vw;

    .board-wrapper__img {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 50%;
      left: 50%;
      translate: -50%-50%;
    }

    #board {
      position: relative;
      z-index: 90;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #delete {
      background-color: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      appearance: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      translate: -50%-50%;
      z-index: 99;
      width: 7em;
      height: auto;
      font-size: 1rem;
      transition: all .3s
    }

    #delete:hover,
    #delete:active {
      transform: scale(110%);
    }

    .description-container {
      position: absolute;
      right: 4vw;
    }

      margin-right: 0.4em;

    .button-container {
      position: absolute;
      right: 8vw;
      bottom: 10vh;
    }

    #save {
      background-color: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      appearance: none;
      position: relative;
      width: 300px;
      transition: all .3s ease;
    }

    #save:hover,
    #save:active {
      transform: scale(1.06);
    }

    .save-img {
      position: absolute;
      width: 100%;
      top: 50%;
      left: 50%;
      translate: -50%-50%;
    }

    .save-img img {
      width: 100%;
    }

    #save span {
      position: relative;
      z-index: 99;
      font-family: var(--jp-font);
      font-size: var(--font-size-M);
      font-weight: 500;
      color: var(--color-Ecru);
    }

    .piece {
      position: absolute;
      width: 100px;
      height: 100px;
      cursor: move;
      transform-origin: center center;
      touch-action: none;
      min-width: 16px;
      min-height: 16px;
    }

    .piece-toolbar img {
      position: relative;
      z-index: 99;
      width: 100px;
      height: 100px;
      object-fit: contain;
      object-position: center;
      display: block;
    }


    .selected {
      outline: 3px solid #00f;
      min-width: 16px;
      min-height: 16px;
    }

    .resize-handle {
      width: 8px;
      height: 8px;
      position: absolute;
      background: #00f;
      border-radius: 50%;
      z-index: 2;
    }

    .tl {
      top: -4px;
      left: -4px;
    }

    .tr {
      top: -4px;
      right: -4px;
    }

    .bl {
      bottom: -4px;
      left: -4px;
    }

    .br {
      bottom: -4px;
      right: -4px;
    }

    .color-selecter {
      position: relative;
      z-index: 99;
      display: flex;
      width: 100%;
      height: 8em;
      justify-content: space-between;
      align-items: center;
    }

    .red-selecter {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #E71F29;
      transition: all .3s ease;
    }

    .red-selecter:hover,
    .red-selecter:active {
      transform: scale(1.1);
    }

    .green-selecter {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #00AC75;
      transition: all .3s ease;
    }

    .green-selecter:hover,
    .green-selecter:active {
      transform: scale(1.1);
    }

    .blue-selecter {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #0062b1;
      transition: all .4s ease;
    }

    .blue-selecter:hover,
    .blue-selecter:active {
      transform: scale(1.1);
    }

    .red-selecter__line {
      border-radius: 50%;
      border: none;
      padding: 4px;
    }

    .green-selecter__line {
      border-radius: 50%;
      border: none;
      padding: 4px;
    }

    .blue-selecter__line {
      border-radius: 50%;
      border: none;
      padding: 4px;
    }

    .red-selecter__line.color-selected {
      border: 4px solid #E71F29;
    }

    .green-selecter__line.color-selected {
      border: 4px solid #00AC75;
    }

    .blue-selecter__line.color-selected {
      border: 4px solid #0062b1;
    }

    @media only screen and (max-width: 1280px) {
      #toolbar {
        flex-direction: column;
      }

      .toolbar-row {
        width: 68vw;
        flex-direction: row;
        gap: calc((68vw - (44px * 5)) / 4);
      }

      .piece-toolbar img {
        max-width: 64px;
        max-height: 64px;
      }


      .red-selecter,
      .green-selecter,
      .blue-selecter {
        width: 44px;
        height: 44px;
      }
    }

    @media only screen and (max-width: 767px) {
      .toolbar-row {
        width: 88vw;

        gap: calc((88vw - (44px * 5)) / 4);
      }

      .piece-toolbar img {
        max-width: 44px;
        max-height: 44px;
      }
    }

    const toolbar = document.getElementById("toolbar");
    const board = document.getElementById("board");
    const parts = Object.keys(svgPaths);

    // ツールバーに表示（ドラッグ用）
    const toolbarRow1 = document.getElementById("toolbar-row1");
    const toolbarRow2 = document.getElementById("toolbar-row2");

    parts.forEach((name, index) => {
      const el = document.createElement("div");
      el.className = "piece-toolbar";
      const img = document.createElement("img");
      const base64 = btoa(unescape(encodeURIComponent(svgPaths[name])));
      img.src = `data:image/svg+xml;base64,${base64}`;
      img.draggable = true;
      img.dataset.part = name;
      el.appendChild(img);

      // ✅ indexで1〜5と6〜10に分けて2段表示
      if (index < 5) {
        toolbarRow1.appendChild(el);
      } else {
        toolbarRow2.appendChild(el);
      }
    });


    // ドラッグ処理
    document.querySelectorAll(".piece-toolbar img").forEach(img => {
      img.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", img.dataset.part);
      });
    });

    board.addEventListener("dragover", e => e.preventDefault());

    board.addEventListener("drop", e => {
      e.preventDefault();
      const name = e.dataTransfer.getData("text/plain");
      const piece = createPiece(name);
      piece.style.left = `${e.offsetX - 40}px`;
      piece.style.top = `${e.offsetY - 40}px`;
      board.appendChild(piece);

      deselectAll();
      piece.classList.add("selected");
      addResizeHandles(piece);

      updateColorSelectorHighlight(piece);
    });





    function createPiece(name) {
      const wrapper = document.createElement("div");
      wrapper.className = "piece " + name;
      wrapper.dataset.name = name;
      wrapper.dataset.x = 0; wrapper.dataset.y = 0;
      wrapper.dataset.angle = 0; wrapper.dataset.scale = 1;
      wrapper.style.left = "100px"; wrapper.style.top = "100px";
      wrapper.style.width = "80px"; wrapper.style.height = "80px";

      // SVGをそのままDOMに挿入する
      wrapper.innerHTML = svgPaths[name];
      const svg = wrapper.querySelector("svg");
      svg.style.width = "100%";
      svg.style.height = "100%";

      setupInteractions(wrapper);
      return wrapper;
    }

    function setupInteractions(el) {
      el.addEventListener("click", e => {
        e.stopPropagation();
        deselectAll();
        el.classList.add("selected");
        addResizeHandles(el);

        updateColorSelectorHighlight(el);
      });



      // ドラッグ・回転・リサイズ処理
      interact(el)
        .draggable({
          modifiers: [
            interact.modifiers.restrictRect({
              restriction: board,
              endOnly: true
            })
          ],
          listeners: {
            move(e) {
              el.dataset.x = +el.dataset.x + e.dx;
              el.dataset.y = +el.dataset.y + e.dy;
              update(el);
            }
          }
        })
        .gesturable({
          listeners: {
            move(e) {
              if (el.dataset._rotating === "1") return; // 回転中なら無視

              el.dataset.angle = +el.dataset.angle + e.da;
              // スケーリング禁止：スキップ
              update(el);
            }
          }
        })

        .resizable({
          edges: { left: true, right: true, bottom: true, top: true },
          modifiers: [
            interact.modifiers.aspectRatio({ ratio: 'preserve' }),
            interact.modifiers.restrictSize({
              min: { width: 10, height: 10 }
            })
          ],
          listeners: {
            move(e) {
              const dx = (e.deltaRect.left), dy = (e.deltaRect.top);
              el.dataset.x = +el.dataset.x + dx;
              el.dataset.y = +el.dataset.y + dy;
              el.style.width = e.rect.width + "px";
              el.style.height = e.rect.height + "px";
              update(el);
            }
          }
        });
    }
    function update(el) {
      el.style.transform = `translate(${el.dataset.x}px,${el.dataset.y}px)
      rotate(${el.dataset.angle}deg) scale(${el.dataset.scale})`;
    }

    function addResizeHandles(el) {
      ["tl", "tr", "bl", "br"].forEach(c => {
        const h = document.createElement("div");
        h.className = "resize-handle " + c;
        h.style.cursor = "grab";
        h.dataset.role = "rotate";
        el.appendChild(h);

        interact(h).draggable({
          listeners: {
            start() {
              el.dataset._rotating = "1";
            },
            move(e) {
              const rect = el.getBoundingClientRect();
              const cx = rect.left + rect.width / 2;
              const cy = rect.top + rect.height / 2;

              const x = e.client.x - cx;
              const y = e.client.y - cy;
              const angle = Math.atan2(y, x) * (180 / Math.PI);

              el.dataset.angle = angle.toFixed(2);
              update(el);
            },
            end() {
              el.dataset._rotating = "0";
            }
          }
        });
      });
    }
    //色を変える
    function setupColorSelectors() {
      document.querySelector('.red-selecter')?.addEventListener('click', (e) => {
        e.stopPropagation(); // ← 追加
        const selected = document.querySelector('.piece.selected');
        if (selected) {
          selected.querySelector('svg path')?.setAttribute('fill', '#e71f29');
          updateColorSelectorHighlight(selected);
        }
      });

      document.querySelector('.green-selecter')?.addEventListener('click', (e) => {
        e.stopPropagation(); // ← 追加
        const selected = document.querySelector('.piece.selected');
        if (selected) {
          selected.querySelector('svg path')?.setAttribute('fill', '#00ac75');
          updateColorSelectorHighlight(selected);
        }
      });

      document.querySelector('.blue-selecter')?.addEventListener('click', (e) => {
        e.stopPropagation(); // ← 追加
        const selected = document.querySelector('.piece.selected');
        if (selected) {
          selected.querySelector('svg path')?.setAttribute('fill', '#0062b1');
          updateColorSelectorHighlight(selected);
        }
      });
    }



    function updateColorSelectorHighlight(el) {
      const path = el.querySelector("svg path");
      const color = path?.getAttribute("fill")?.toLowerCase();

      // すべての色セレクターから color-selected を外す
      document.querySelectorAll(".color-selecter__line").forEach(sel => {
        sel.classList.remove("color-selected");
      });

      // 色に応じて対応するセレクターに color-selected を付ける
      if (color === "#e71f29") {
        document.querySelector(".red-selecter__line")?.classList.add("color-selected");
      } else if (color === "#00ac75") {
        document.querySelector(".green-selecter__line")?.classList.add("color-selected");
      } else if (color === "#0062b1") {
        document.querySelector(".blue-selecter__line")?.classList.add("color-selected");
      } else {
        console.warn("Unknown color:", color); // デバッグ用
      }
    }

    // 初期化時に呼び出す
    setupColorSelectors();


    //パーツ削除の処理
    document.addEventListener("keydown", e => {
      if (e.key === "Delete" || e.key === "Backspace") {
        deleteSelectedPiece();
      }
    });

    // ボタン押下で削除
    document.getElementById("delete").addEventListener("click", deleteSelectedPiece);

    // 選択されている .piece を削除する関数
    function deleteSelectedPiece() {
      const selected = document.querySelector(".piece.selected");
      if (selected) selected.remove();
    }
    function deselectAll() {
      document.querySelectorAll(".piece.selected").forEach(p => {
        p.classList.remove("selected");
        p.querySelectorAll(".resize-handle").forEach(h => h.remove());
      });

      // 色セレクターのハイライトもリセット
      document.querySelectorAll(".color-selecter__line").forEach(sel => {
        sel.classList.remove("color-selected");
      });
    }

    document.body.addEventListener("click", deselectAll);
    //ダウンロードの処理
    document.getElementById("save").addEventListener("click", () => {
      // すべての resize-handle を非表示に
      const handles = document.querySelectorAll(".resize-handle");
      handles.forEach(h => h.style.display = "none");

      html2canvas(board, { backgroundColor: "#fff", useCORS: true })
        .then(c => {
          const a = document.createElement("a");
          a.href = c.toDataURL("image/jpeg");
          a.download = "Zonetsu.jpg";
          a.click();
        })
        .catch(() => alert("保存失敗"))
        .finally(() => {
          // キャプチャ後、元に戻す
          handles.forEach(h => h.style.display = "");
        });
    });
